<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>佳駿警考｜司法院判決搜尋</title>
<style>
body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.box,.card{background:#fff;border:1px solid #e4e8f0;border-radius:16px}.box{padding:20px;box-shadow:0 8px 30px #2233aa0d}.title{font-size:25px;font-weight:800}.sub,.meta,.status{color:#667085}.search{display:flex;gap:10px;margin-top:16px}input{flex:1;padding:13px 15px;border:1px solid #cfd6e4;border-radius:11px;font-size:16px}button,.btnlink{border:0;border-radius:11px;padding:10px 16px;background:#2457e6;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#eef2ff;color:#2445aa}.mode{display:flex;gap:8px;margin-top:12px}.mode button{padding:9px 12px}.mode button.active{background:#2457e6;color:white}.status{margin:12px 2px}.card{padding:16px;margin:12px 0}.case{font-weight:800;font-size:17px}.meta{font-size:13px;margin:5px 0 10px}.snippet,.full{white-space:pre-wrap;line-height:1.75}.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.score{font-weight:700;color:#2457e6}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#2445aa;font-size:12px;font-weight:800;margin-right:6px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.panel{background:#fff;border-radius:16px;max-width:960px;width:100%;max-height:88vh;overflow:auto;padding:20px}.close{float:right;background:#eef2ff;color:#2140aa}.hint{font-size:13px;color:#667085;margin-top:8px}@media(max-width:640px){.search{flex-direction:column}.search button{min-height:44px}.wrap{padding:12px}.mode{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="title">司法院判決搜尋</div><div class="sub">先查自己的判決索引；尚未匯入的舊案會自動即時查司法院。</div><div class="mode"><button id="kwMode" class="active">全文／判決號</button><button id="semMode" class="secondary">中文語意搜尋</button></div><div class="search"><input id="q" placeholder="例：109台抗1070、103台非222、法官迴避前審"><button id="go">搜尋</button></div><div class="hint" id="hint">輸入判決號時會先精確搜尋本地索引；沒有就自動補查司法院。</div><div class="status" id="status">輸入內容開始搜尋</div></div><div id="results"></div></div>
<div id="modal" class="modal"><div class="panel"><button class="close" id="close">關閉</button><h2 id="docTitle"></h2><div class="meta" id="docMeta"></div><div class="full" id="docText"></div></div></div>
<script>
const API='https://dkqwnkplpgiauqknwbci.supabase.co/functions/v1/judicial-search-api';
const g=i=>document.getElementById(i);let mode='keyword';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cn(r){const a=[];if(r.case_year)a.push(r.case_year+'年度');if(r.case_type)a.push(r.case_type+'字');if(r.case_no)a.push('第'+r.case_no+'號');return a.join('')||r.source_key||'裁判'}
function setMode(m){mode=m;g('kwMode').className=m==='keyword'?'active':'secondary';g('semMode').className=m==='semantic'?'active':'secondary';g('hint').textContent=m==='keyword'?'判決號先查本地；尚未匯入會自動即時查司法院。':'適合白話問題；第一次會下載中文 BGE 模型到瀏覽器快取。'}
function render(rows,semantic,retrieval){const live=retrieval==='judicial-live';g('status').textContent=live?('本地尚未匯入，已即時查司法院：找到 '+rows.length+' 筆'):((retrieval==='exact-case'?'判決號精確搜尋：':'找到 ')+rows.length+' 筆結果');let h='';for(const x of rows){const text=semantic?(x.content||''):(x.snippet||'');const score=semantic&&x.score!=null?'<span class="score">語意 '+(Number(x.score)*100).toFixed(1)+'%</span> · ':'';const badge=x.live?'<span class="badge">司法院即時</span>':'';let actions='';if(x.live&&x.official_url){actions='<a class="btnlink" href="'+esc(x.official_url)+'" target="_blank" rel="noopener">司法院全文</a>'+(x.pdf_url?'<a class="btnlink secondary" href="'+esc(x.pdf_url)+'" target="_blank" rel="noopener">PDF</a>':'')}else if(x.doc_id){actions='<button data-doc="'+esc(x.doc_id)+'">查看全文</button>'}h+='<div class="card"><div class="case">'+badge+esc(cn(x))+'｜'+esc(x.title||'')+'</div><div class="meta">'+score+esc(x.decision_date||'')+' '+esc(x.court||'')+' · '+esc(x.cause||x.source_key||'')+'</div><div class="snippet">'+esc(text)+'</div><div class="actions">'+actions+'</div></div>'}g('results').innerHTML=h||(live?'<div class="card">本地索引與司法院即時查詢都沒有找到符合結果。</div>':'<div class="card">目前已匯入／建立索引的資料中沒有找到結果。</div>');document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>openDoc(b.getAttribute('data-doc')))}
async function keywordRun(q){const r=await fetch(API+'?api=search&q='+encodeURIComponent(q));const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'搜尋失敗');render(j.results||[],false,j.retrieval)}
async function openDoc(id){g('modal').classList.add('open');g('docTitle').textContent='載入中…';g('docText').textContent='';const r=await fetch(API+'?api=doc&id='+encodeURIComponent(id));const j=await r.json();if(!r.ok||!j.ok){g('docTitle').textContent='讀取失敗';g('docText').textContent=j.error||'';return}const x=j.document;g('docTitle').textContent=cn(x)+'｜'+(x.title||'');g('docMeta').textContent=[x.decision_date,x.court,x.source_key].filter(Boolean).join(' · ');g('docText').textContent=x.full_text||''}
async function run(){const q=g('q').value.trim();if(!q)return;g('results').innerHTML='';try{if(mode==='keyword'){g('status').textContent='先查本地索引，必要時即時查司法院…';await keywordRun(q)}else{g('status').textContent='正在載入中文語意模型…';await window.semanticSearch(q)}}catch(e){g('status').textContent='搜尋失敗：'+e.message}}
g('kwMode').onclick=()=>setMode('keyword');g('semMode').onclick=()=>setMode('semantic');g('go').onclick=run;g('close').onclick=()=>g('modal').classList.remove('open');g('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});window.renderSemantic=rows=>render(rows,true,'semantic');
</script>
<script type="module">
import {pipeline,env} from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';env.allowLocalModels=false;env.useBrowserCache=true;let extractor=null;const MODEL='Xenova/bge-small-zh-v1.5';const INST='为这个句子生成表示以用于检索相关文章：';window.semanticSearch=async function(q){if(!extractor){document.getElementById('status').textContent='第一次載入中文 BGE 模型（約 24MB）…';extractor=await pipeline('feature-extraction',MODEL,{quantized:true})}document.getElementById('status').textContent='產生查詢向量並搜尋中…';const out=await extractor(INST+q,{pooling:'cls',normalize:true});const vector=Array.from(out.data);if(vector.length!==512)throw new Error('語意模型維度異常：'+vector.length);const r=await fetch(API+'?api=semantic',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q,vector,limit:20})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'語意搜尋失敗');window.renderSemantic(j.results||[])};
</script>
</body></html>
