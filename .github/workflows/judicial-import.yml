name: Judicial Yuan Historical Import

on:
  workflow_dispatch:
    inputs:
      max_months:
        description: "Maximum months per worker in this run"
        required: false
        default: "1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: judicial-yuan-history-import-v2
  cancel-in-progress: false

jobs:
  import:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        worker: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKER_URL: https://dkqwnkplpgiauqknwbci.supabase.co/functions/v1/judicial-github-worker
      CLAIM_URL: https://dkqwnkplpgiauqknwbci.supabase.co/functions/v1/judicial-github-claim
      MAX_MONTHS: ${{ github.event.inputs.max_months || '1' }}
      MAX_RUNTIME_SECONDS: "3600"
      WORKER_SLOT: ${{ matrix.worker }}
      API_MAX_ATTEMPTS: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar p7zip-full

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Import Judicial Yuan monthly archives
        run: python scripts/import_judicial_parallel.py
