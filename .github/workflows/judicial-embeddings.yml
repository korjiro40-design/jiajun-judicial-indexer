name: Judicial Chinese Embeddings

on:
  workflow_dispatch:
    inputs:
      max_chunks:
        description: "Maximum chunks to embed in this run"
        required: false
        default: "500"

permissions:
  contents: read
  id-token: write

concurrency:
  group: judicial-chinese-embeddings
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMBED_WORKER_URL: https://dkqwnkplpgiauqknwbci.supabase.co/functions/v1/judicial-embedding-worker
      MAX_CHUNKS: ${{ github.event.inputs.max_chunks || '500' }}
      MAX_RUNTIME_SECONDS: "3600"
      CLAIM_BATCH: "16"
      ENCODE_BATCH: "16"
      API_MAX_ATTEMPTS: "5"
      HF_HOME: ~/.cache/huggingface
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache BGE model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-small-zh-v1.5-v1

      - name: Install embedding dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Build Chinese semantic embeddings
        run: python scripts/embed_judicial.py
